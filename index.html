<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimador Pipefy - Projetos de Implementação</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-shadow {
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .animate-fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-6">
        <div class="container mx-auto px-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-calculator text-2xl"></i>
                    <h1 class="text-2xl font-bold">Estimador Pipefy</h1>
                </div>
                <div class="text-sm">
                    <span class="bg-white bg-opacity-20 px-3 py-1 rounded-full">
                        <i class="fas fa-chart-line mr-1"></i>
                        Baseado em Dados Históricos
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-8">
        <!-- Progress Bar -->
        <div class="mb-8">
            <div class="flex items-center justify-center space-x-4 mb-4">
                <div class="flex items-center">
                    <div id="step1-indicator" class="w-8 h-8 bg-blue-500 text-white rounded-full flex items-center justify-center text-sm font-bold">1</div>
                    <span class="ml-2 text-sm font-medium">Dados Gerais</span>
                </div>
                <div class="w-16 h-0.5 bg-gray-300"></div>
                <div class="flex items-center">
                    <div id="step2-indicator" class="w-8 h-8 bg-gray-300 text-gray-600 rounded-full flex items-center justify-center text-sm font-bold">2</div>
                    <span class="ml-2 text-sm font-medium">Processos</span>
                </div>
                <div class="w-16 h-0.5 bg-gray-300"></div>
                <div class="flex items-center">
                    <div id="step3-indicator" class="w-8 h-8 bg-gray-300 text-gray-600 rounded-full flex items-center justify-center text-sm font-bold">3</div>
                    <span class="ml-2 text-sm font-medium">Estimativa</span>
                </div>
            </div>
        </div>

        <!-- Form Container -->
        <div class="max-w-4xl mx-auto">
            <!-- Step 1: Dados Gerais -->
            <div id="step1" class="animate-fade-in">
                <div class="bg-white rounded-lg card-shadow p-8 mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                        <i class="fas fa-building mr-3 text-blue-500"></i>
                        Informações Gerais do Projeto
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tipo do Cliente</label>
                            <input type="text" id="clienteNome" placeholder="Ex: Empresa de tecnologia de médio porte" 
                                   class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tamanho do Cliente</label>
                            <select id="tamanhoCliente" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Selecione...</option>
                                <option value="Pequeno">Pequeno (até 50 funcionários)</option>
                                <option value="Médio">Médio (51-200 funcionários)</option>
                                <option value="Grande">Grande (201-1000 funcionários)</option>
                                <option value="Enterprise">Enterprise (1000+ funcionários)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Objetivo Principal</label>
                            <textarea id="objetivoPrincipal" placeholder="Ex: Automatizar processos de recrutamento e seleção..."
                                      class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent h-24"></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Maturidade Digital</label>
                            <select id="maturidadeDigital" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Selecione...</option>
                                <option value="Baixa">Baixa - Pouca familiaridade com ferramentas digitais</option>
                                <option value="Média">Média - Alguma experiência, processos ainda manuais</option>
                                <option value="Alta">Alta - Já usam ferramentas, familiarizados com automação</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Número de Usuários</label>
                            <input type="number" id="numeroUsuarios" placeholder="Ex: 25" 
                                   class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Expectativa de Prazo</label>
                            <select id="expectativaPrazo" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                <option value="">Selecione...</option>
                                <option value="Urgente">Urgente - 30 dias</option>
                                <option value="Moderado">Moderado - 60-90 dias</option>
                                <option value="Flexível">Flexível - mais de 90 dias</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="mt-8 flex justify-end">
                        <button onclick="nextStep(2)" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition-colors flex items-center">
                            Próximo: Processos <i class="fas fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Step 2: Processos -->
            <div id="step2" class="hidden">
                <div class="bg-white rounded-lg card-shadow p-8 mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                        <i class="fas fa-sitemap mr-3 text-blue-500"></i>
                        Processos de RH (3 processos identificados)
                    </h2>
                    
                    <div id="processos-container">
                        <!-- Processos serão adicionados dinamicamente -->
                    </div>
                    
                    <div class="mt-8 flex justify-between">
                        <button onclick="prevStep(1)" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition-colors flex items-center">
                            <i class="fas fa-arrow-left mr-2"></i> Voltar
                        </button>
                        <button onclick="nextStep(3)" class="bg-blue-500 text-white px-6 py-3 rounded-lg hover:bg-blue-600 transition-colors flex items-center">
                            Gerar Estimativa <i class="fas fa-calculator ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Step 3: Estimativa -->
            <div id="step3" class="hidden">
                <div class="bg-white rounded-lg card-shadow p-8 mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center">
                        <i class="fas fa-chart-bar mr-3 text-blue-500"></i>
                        Estimativa Detalhada
                    </h2>
                    
                    <div id="estimativa-container">
                        <!-- Estimativa será gerada aqui -->
                    </div>
                    
                    <div class="mt-8 flex justify-between">
                        <button onclick="prevStep(2)" class="bg-gray-500 text-white px-6 py-3 rounded-lg hover:bg-gray-600 transition-colors flex items-center">
                            <i class="fas fa-arrow-left mr-2"></i> Voltar
                        </button>
                        <button onclick="exportEstimativa()" class="bg-green-500 text-white px-6 py-3 rounded-lg hover:bg-green-600 transition-colors flex items-center">
                            <i class="fas fa-download mr-2"></i> Exportar PDF
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
